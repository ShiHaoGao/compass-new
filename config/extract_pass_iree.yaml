  name: iree-stream-verify-async-access-ranges
  type: mlir::ModuleOp
- description: Verifies that all stream.async.* ops and types are fully lowered to
    stream.cmd.* ops.
  dialect: stream
  name: iree-stream-verify-lowering-to-cmd
  type: mlir::ModuleOp
passes:
- description: Applies some risky/IREE-specific canonicalization patterns.
  dialect: iree
  name: iree-util-apply-patterns
  type: ModuleOp
- description: Combines global initializers into one.
  dialect: iree
  name: iree-util-combine-initializers
  type: mlir::ModuleOp
- description: Deletes operations that have no runtime equivalent and are only used
