  dialect: iree
  name: iree-util-dump-module
  type: mlir::ModuleOp
- description: Iterates a sub-pipeline to a fixed point.
  dialect: iree
  name: iree-util-fixed-point-iterator
  type: ModuleOp
- description: Performs basic inter-procedural optimization.
  dialect: iree
  name: iree-util-ipo
  type: mlir::ModuleOp
- description: Optimizes integer arithmetic using a variety of dataflow analysis and
    patterns.
  dialect: iree
  name: iree-util-optimize-int-arithmetic
  type: ModuleOp
- description: Propagates resource subranges across the program.
  dialect: iree
  name: iree-util-propagate-subranges
  type: mlir::ModuleOp
- description: Strips constant util.global ops and replaces them with splats.
  dialect: iree
  name: iree-util-strip-and-splat-constants
  type: mlir::ModuleOp
- description: Strips debug ops, like assertions.
  dialect: iree
  name: iree-util-strip-debug-ops
  type: ModuleOp
- description: Folds duplicate globals and propagates constants.
  dialect: iree
  name: iree-util-fold-globals
  type: mlir::ModuleOp
- description: Fuses correlated globals together.
  dialect: iree
  name: iree-util-fuse-globals
  type: mlir::ModuleOp
- description: Greedily hoists eligible constant expressions into globals.
  dialect: iree
  name: iree-util-hoist-into-globals
  type: mlir::ModuleOp
- description: Hoists loads and sinks stores to variables to decrease data dependency
    regions.
  dialect: iree
  name: iree-util-simplify-global-accesses
  type: mlir::CallableOpInterface
- description: Imports IR with arbitrary large-data into resources that IREE can manage
    efficiently.
  dialect: iree
  name: iree-util-import-resources
  type: ModuleOp
- description: Annotates ops with globally unique IDs for debugging.
  dialect: iree
  name: iree-util-annotate-op-ordinals
  type: mlir::ModuleOp
- description: Tests util dialect conversion patterns.
  dialect: iree
  name: iree-util-test-conversion
  type: mlir::ModuleOp
- description: Tests floating point range analysis.
  dialect: iree
  name: iree-util-test-float-range-analysis
  type: ModuleOp
passes:
- description: Converts from various dialects to the VMVX dialect.
  dialect: vmvx
  name: iree-vmvx-conversion
  type: mlir::ModuleOp
- description: Materializes executable constant global values.
  dialect: vmvx
  name: iree-vmvx-materialize-constants
  type: mlir::ModuleOp
- description: Resolves any existing vmvx.get_buffer_descriptor ops.
  dialect: vmvx
  name: iree-vmvx-resolve-buffer-descriptors
  type: ModuleOp
passes:
- description: Convert TMTensor ops to loops and Linalg ops.
  dialect: TMTensor
