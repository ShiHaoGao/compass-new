dialects:

  global:
    passes:
    - name: iree-flow-convert-to-flow
      description: Convert operations to flow. Currently just a test pass.
      type: MODULE
      next_pass: null
    - name: iree-stream-conversion
      description: Converts from flow and other input dialects into the stream dialect.
      type: MODULE
      next_pass: null
    - name: iree-vmvx-conversion
      description: Converts from various dialects to the VMVX dialect.
      type: MODULE
      next_pass: null

  stablehlo:
    description: Unspecified dialect
    passes:
    - name: iree-stablehlo-to-iree-input
      description: Converts StableHLO input to IREE input dialects.
      type: MODULE
      next_pass: null
    - name: iree-stablehlo-to-linalg-ext
      description: Converts from StableHLO ops to LinalgExt ops and distribute to Flow ops.
      type: FUNC
      next_pass: null
    - name: iree-stablehlo-to-linalg
      description: Converts from StableHLO ops to Linalg ops on.
      type: MODULE
      next_pass: null
    - name: iree-stablehlo-legalize-control-flow
      description: Legalizes from StableHLO control flow to SCF control flow.
      type: FUNC
      next_pass: null
    - name: iree-stablehlo-legalize-chlo
      description: Legalizes from CHLO ops flow to StableHLO and Shape ops.
      type: FUNC
      next_pass: null
    - name: iree-stablehlo-legalize-custom-calls
      description: Legalizes specialized custom calls to decomposed implementations.
      type: FUNC
      next_pass: null
    - name: iree-stablehlo-legalize-shape-computations
      description: Legalizes StableHLO shape operations to core-mlir operations.
      type: FUNC
      next_pass: null
    - name: iree-stablehlo-verify-compiler-input-legality
      description: Verifies that only supported IR constructs are passed to the compiler.
      type: MODULE
      next_pass: null
    - name: iree-stablehlo-to-stablehlo-preprocessing
      description: Applies IREE-specific stablehlo to stablehlo preprocessing transformations.
      type: MODULE
      next_pass: null
    - name: iree-stablehlo-canonicalize
      description: Canonicalizes StableHLO operations.
      type: FUNC
      next_pass: null
    - name: iree-stablehlo-preprocessing-dot-general-to-dot
      description: Lowers general dot to a non-batched dot when possible.
      type: FUNC
      next_pass: null
    - name: iree-stablehlo-preprocessing-einsum-to-dot-general
      description: Legalizes einsum ops to general dot ops.
      type: FUNC
      next_pass: null
    - name: iree-stablehlo-preprocessing-flatten-cfg-tuples
      description: Flattens tuples in the CFG form of StableHLO.
      type: MODULE
      next_pass: null
    - name: iree-stablehlo-preprocessing-flatten-scf-tuples
      description: Flattens tuples in the SCF form of StableHLO.
      type: MODULE
      next_pass: null
    - name: iree-stablehlo-preprocessing-gather-to-torch-index-select
      description: Legalizes gathers to a torch index select.
      type: FUNC
      next_pass: null
    - name: iree-stablehlo-preprocessing-lower-complex
      description: Lowers complex operations into non-complex operations.
      type: FUNC
      next_pass: null
    - name: iree-stablehlo-preprocessing-unfuse-batch-norm
      description: Materializes 'broadcast_dimensions' attributes.
      type: FUNC
      next_pass: null
  
  torch_c:
    passes:
    - name: torch-func-backend-type-conversion
      description: Partial type conversion pass analogous in scope to the upstream
        `func-bufferize` pass.
      type: MODULE
      next_pass: null
    - name: torch-func-backend-type-conversion-for-stablehlo
      description: Partial type conversion pass analogous in scope to the upstream
        `func-bufferize` pass.
      type: MODULE
      next_pass: null
    - name: torch-finalizing-backend-type-conversion
      description: Analogous in scope to the upstream `finalizing-bufferize` pass.
      type: FUNC
      next_pass: null
    - name: torch-finalizing-backend-type-conversion-for-stablehlo
      description: Analogous in scope to the upstream `finalizing-bufferize` pass.
      type: FUNC
      next_pass: null
    - name: torch-unpack-quant-tensor
      description: Unpack quantized int4 tensor from int8 container.
      type: FUNC
      next_pass: null
    - name: torch-verify-tosa-backend-contract
      description: Verifies conformity to the linalg-on-tensors backend contract.
      type: MODULE
      next_pass: null

  iree_gpu:
    description: gpu dialect
    passes:
    - name: iree-gpu-combine-barrier-regions
      description: Combines `iree_gpu.barrier_region` ops.
      type: MODULE
      next_pass: null
    - name: iree-gpu-concretize-mma-shapes
      description: Expands the inner dimensions of iree_gpu.multi_mma ops to match the thread layout.
      type: FUNC
      next_pass: null
    - name: iree-gpu-distribute-mma-to-lanes
      description: Distributes iree_gpu.multi_mma ops to lanes.
      type: FUNC
      next_pass: null
    - name: iree-gpu-lower-ops
      description: Post bufferization lowerings of iree_gpu ops before late lowerings.
      type: FUNC
      next_pass: null
    - name: iree-gpu-unroll-to-intrinsics
      description: Unrolls iree_gpu.multi_mma ops to their inner vector size.
      type: FUNC
      next_pass: null
    - name: iree-gpu-vectorize-ops
      description: Vectorizes then lowers a few iree_gpu ops before vectorization.
      type: FUNC
      next_pass: null

  iree_vector_ext:
    description: iree_vector_ext dialect
    passes:
    - name: iree-vector-ext-vectorize-ops
      description: Vectorizes then lowers a few iree_vector_ext ops before vectorization.
      type: MODULE
      next_pass: null
    - name: iree-vector-ext-fold-unit-extent-dims
      description: Folds unit dims for iree_vector_ext ops.
      type: MODULE
      next_pass: null

  flow:
    description: Flow dialect
    passes:
    - name: iree-flow-annotate-dispatches
      description: Annotates executable dispatches based on their contents.
      type: MODULE
      next_pass: null
    - name: iree-flow-canonicalize
      description: Flow specific canonicalization pass.
      type: MODULE
      next_pass: null
    - name: iree-flow-capture-dynamic-dims
      description: Captures dynamic shape dimensions required by dispatch operands/results
        and control flow operations.
      type: MODULE
      next_pass: null
    - name: iree-flow-cleanup-tensor-shapes
      description: Cleans up any remaining tensor shape metadata after lowering.
      type: MODULE
      next_pass: null
    - name: iree-convert-mesh-to-flow
      description: Convert Mesh dialect operations to flow.
      type: MODULE
      next_pass: null

    - name: iree-flow-deduplicate-executables
      description: Deduplicates executables that are identical.
      type: MODULE
      next_pass: null
    - name: iree-flow-dump-dispatch-graph-pass
      description: Dump visualization of dispatches within the program.
      type: MODULE
      next_pass: null
    - name: iree-flow-export-benchmark-funcs-pass
      description: Exports all functions and dispatch executables as `() -> ()` benchmark
        funcs.
      type: MODULE
      next_pass: null
    - name: iree-flow-initialize-empty-tensors
      description: Initialize all empty tensors after dispatch formation to zero or
        uninitialized allocations.
      type: MODULE
      next_pass: null
    - name: iree-flow-inject-dispatch-tracing
      description: Injects tracing markers for dispatch operation tensor inputs and
        outputs.
      type: FUNC
      next_pass: null
    - name: iree-flow-inject-tensor-tracing
      description: Injects tensor tracing on ops annotated with `iree.tensor.trace`.
      type: FUNC
      next_pass: null
    - name: iree-flow-insert-debug-target-at-symbol
      description: Crops and/or traces the program at the specified symbol.
      type: MODULE
      next_pass: null
    - name: iree-flow-insert-debug-target-at-ordinal
      description: Crops and/or traces the program at the specified ordinal.
      type: MODULE
      next_pass: null
    - name: iree-flow-outline-constants
      description: Outlines tensor constants throughout the program into globals initialized
        with stream ops.
      type: MODULE
      next_pass: null
    - name: iree-flow-outline-dispatch-externs
      description: Outlines external dispatches into executables.
      type: MODULE
      next_pass: null
    - name: iree-flow-outline-dispatch-regions
      description: Outlines dispatch regions into executables.
      type: MODULE
      next_pass: null
    - name: iree-top-level-scf-to-cfg
      description: Converts non-nested SCF constructs to CFG (not traversing into
        opaque operations).
      type: FUNC
      next_pass: null
    - name: iree-verify-input-legality
      description: Checks the legality of the IR at the start of IREE flow transformation
        pipeline.
      type: MODULE
      next_pass: null
  hal:
    description: hal dialect
    passes:
    - name: iree-hal-conversion
      description: Converts from stream and other intermediate dialects into the hal
        dialect.
      type: MODULE
      next_pass: null
    - name: iree-hal-assign-legacy-target-devices
      description: Assigns the HAL devices the module will target to the given list
        of targets.
      type: MODULE
      next_pass: null
    - name: iree-hal-assign-target-devices
      description: Assigns the HAL devices the module will target to the given list
        of target specifications.
      type: MODULE
      next_pass: null
    - name: iree-hal-materialize-target-devices
      description: Materializes global device handles based on a `hal.device.targets`
        spec.
      type: MODULE
      next_pass: null
    - name: iree-hal-resolve-device-promises
      description: Resolves `#hal.device.promise` attributes to their devices.
      type: MODULE
      next_pass: null
    - name: iree-hal-resolve-device-aliases
      description: Resolves `#hal.device.alias` attributes to their expanded configurations.
      type: MODULE
      next_pass: null
    - name: iree-hal-verify-devices
      description: Verifies that all devices can be targeted with the available compiler
        plugins.
      type: MODULE
      next_pass: null
    - name: iree-hal-fixup-legacy-sync
      description: Applies fixups to the program for when using legacy HAL devices.
      type: MODULE
      next_pass: null
    - name: iree-hal-inline-memoize-regions
      description: Inlines `hal.device.memoize` regions into their parent region.
      type: MODULE
      next_pass: null
    - name: iree-hal-outline-memoize-regions
      description: Outlines `hal.device.memoize` regions and creates global resources.
      type: MODULE
      next_pass: null
    - name: iree-hal-memoize-device-queries
      description: Finds hal.device.query ops and creates variables initialized on
        startup.
      type: MODULE
      next_pass: null
    - name: iree-hal-materialize-interfaces
      description: Defines hal.executable variants for stream.executable ops.
      type: MODULE
      next_pass: null
    - name: iree-hal-substitute-executables
      description: Substitutes hal.executable ops with files on disk.
      type: MODULE
      next_pass: null
    - name: iree-hal-preprocess-executables-with-pipeline
      description: Preprocess each executable with an MLIR pass pipeline.
      type: IREE::HAL::ExecutableOp
      next_pass: null
    - name: iree-hal-preprocess-executables-with-tool
      description: Preprocess each executable with an external command line tool.
      type: IREE::HAL::ExecutableOp
      next_pass: null
    - name: iree-hal-configure-executables
      description: Configures hal.executable ops via a nested translation pipeline.
      type: IREE::HAL::ExecutableOp
      next_pass: null
    - name: iree-hal-configure-target-executable-variants
      description: Configures hal.executable.variant ops for the specified target
        backend.
      type: IREE::HAL::ExecutableVariantOp
      next_pass: null
    - name: iree-hal-translate-all-executables
      description: Translates hal.executable ops via a nested translation pipeline.
      type: IREE::HAL::ExecutableOp
      next_pass: null
    - name: iree-hal-translate-target-executable-variants
      description: Translates hal.executable.variant ops for the specified target
        backend.
      type: IREE::HAL::ExecutableVariantOp
      next_pass: null
    - name: iree-hal-hoist-executable-objects
      description: Hoists local executable object annotations to the parent `hal.executable.variant`.
      type: IREE::HAL::ExecutableVariantOp
      next_pass: null
    - name: iree-hal-prune-executables
      description: Prunes executable variants and exports that are not referenced.
      type: MODULE
      next_pass: null
    - name: iree-hal-link-all-executables
      description: Links hal.executable ops into one or more hal.executable ops.
      type: MODULE
      next_pass: null
    - name: iree-hal-link-target-executables
      description: Links executables for the specified target backend.
      type: MODULE
      next_pass: null
    - name: iree-hal-resolve-export-ordinals
      description: Resolves symbolic hal.executable.export references to ordinals.
      type: MODULE
      next_pass: null
    - name: iree-hal-serialize-all-executables
      description: Converts hal.executable.variants to one or more hal.executable.binary
        ops.
      type: IREE::HAL::ExecutableOp
      next_pass: null
    - name: iree-hal-serialize-target-executables
      description: Serializes executables for the specified target backend.
      type: IREE::HAL::ExecutableOp
      next_pass: null
    - name: iree-hal-materialize-dispatch-instrumentation
      description: Adds dispatch instrumentation for both host and device prior to
        materializing interfaces so that the higher-level stream dialect can be used
        to easily mutate the dispatch sites, executable exports, and resources used
        for instrumentation storage.
      type: MODULE
      next_pass: null
    - name: iree-hal-initialize-devices
      description: Initializes each global `!hal.device` based on the specification
        attribute by building initializers that enumerate and select the appropriate
        device.
      type: MODULE
      next_pass: null
    - name: iree-hal-materialize-resource-caches
      description: Scans the program for resource lookups such as `hal.executable.lookup`
        and materializes globals initialized on startup. The original lookup ops are
        replaced with global loads of the cached resources.
      type: MODULE
      next_pass: null
    - name: iree-hal-elide-redundant-commands
      description: Identifies sequences of stateful command buffer operations such
        as `hal.command_buffer.push_descriptor_set` that set redundant state that
        arise from trivial conversion from the stateless stream dialect and removes
        them to reduce binary size and runtime overhead.
      type: MODULE
      next_pass: null
    - name: iree-hal-capture-executable-sources
      description: Captures a source listing of each hal.executable.variant and attaches
        the source to the variant embedded in the IR. Entry points are assigned locations
        in the IR relative to the captured source.
      type: MODULE
      next_pass: null
    - name: iree-hal-dump-executable-sources
      description: Dumps a source listing of each hal.executable and updates the source
        locations in the IR to point at the produced files. This allows for easy inspection
        of each executable prior to translation and gives downstream tools that can
        display source information (Tracy, perf, etc) something more useful than the
        entire original source program.
      type: MODULE
      next_pass: null
    - name: iree-hal-dump-executable-benchmarks
      description: Dumps one MLIR file per hal.executable containing the executable
        contents and the host code required to dispatch them with fake buffers and
        operands. These benchmarks can be run with the `iree-benchmark-module` tool
        to microbenchmark individual dispatches outside of the whole program context.
      type: MODULE
      next_pass: null
    - name: iree-hal-strip-executable-contents
      description: A debugging pass for stripping translated executable contents (LLVM
        dialect, SPIR-V dialect, etc) to reduce IR size and noise from the device-only
        code.
      type: MODULE
      next_pass: null
    - name: iree-hal-repeat-dispatches
      description: Finds all hal.command_buffer.dispatch ops and repeats them the
        specified number of times by cloning them and inserting a barrier. This is
        extremely unreliable and nearly always creates incorrect programs that have
        wildly incorrect end-to-end execution timings.
      type: MODULE
      next_pass: null

  iree_linalg_ext:
    description: linalg dialect
    passes:
    - name: iree-linalg-ext-to-loops
      description: Convert LinalgExt ops to loops and Linalg ops.
      type: FUNC
      next_pass: null
    - name: iree-linalg-pad-contraction-to-block-size
      description: Pads contraction (matmul) ops to next multiple of block size.
      type: MODULE
      next_pass: null
    - name: iree-linalg-ext-topk-split-reduction
      description: Topk split reduction pass with a map-reduce style of parallelizing
        a Topk Op.
      type: FUNC
      next_pass: null
    - name: iree-linalg-ext-decompose-im2col
      description: Decomposes im2col ops into insert and extract slice ops.
      type: FUNC
      next_pass: null
    - name: iree-linalg-ext-decompose-winograd
      description: Decomposes winograd transform ops into linalg ops.
      type: FUNC
      next_pass: null
    - name: iree-linalg-ext-convert-conv2d-to-im2col-op
      description: Convert linalg convolution ops to im2col gemm based implementation.
      type: FUNC
      next_pass: null
    - name: iree-linalg-ext-convert-conv2d-to-winograd
      description: Convert linalg convolution ops to winograd based implementation.
      type: FUNC
      next_pass: null
    - name: iree-linalg-ext-decompose-attention
      description: Decomposes attention op into a sequence of linalg ops.
      type: FUNC
      next_pass: null
    - name: iree-linalg-ext-convert-attention-to-online-attention
      description: Converts attention op to online_attention op.
      type: MODULE
      next_pass: null

  stream:
    description: stream dialect
    passes:
      - name: iree-stream-encode-host-tensors
        description: Encodes tensors into storage formats based on affinity and target
          support.
        type: MODULE
        next_pass: null
      - name: iree-stream-encode-device-tensors
        description: Encodes tensors into binary formats based on affinity and target
          support.
        type: MODULE
        next_pass: null
      - name: iree-stream-materialize-builtins
        description: Materialize dispatches to builtin executables where required.
        type: MODULE
        next_pass: null
      - name: iree-stream-materialize-copy-on-write
        description: "Materializes copy-on-write (\U0001F404) behavior as explicit ops."
        type: MODULE
        next_pass: null
      - name: iree-stream-elide-async-copies
        description: Elides copies when they are not performing meaningful work.
        type: MODULE
        next_pass: null
      - name: iree-stream-emplace-allocations
        description: Emplaces transient tensor allocations to remove copies.
        type: MODULE
        next_pass: null
      - name: iree-stream-refine-usage
        description: Refines resource usage bits and inserts transfers where appropriate.
        type: MODULE
        next_pass: null
      - name: iree-stream-schedule-execution
        description: Identifies and groups asynchronous operations into executable regions
          within function-like regions.
        type: FUNC
        next_pass: null
      - name: iree-stream-schedule-concurrency
        description: Identifies and groups asynchronous operations within executable
          regions that can run concurrently and groups them into streams.
        type: FUNC
        next_pass: null
      - name: iree-stream-propagate-timepoints
        description: Materializes timepoints and sinks them to consumers throughout
          the whole program.
        type: MODULE
        next_pass: null
      - name: iree-stream-elide-timepoints
        description: Elides timepoints that are known to be covered by dependent timepoints.
        type: MODULE
        next_pass: null
      - name: iree-stream-schedule-allocation
        description: Allocates resources and converts to explicit stream commands.
        type: MODULE
        next_pass: null
      - name: iree-stream-pack-constants
        description: Packs and allocates backing storage for fused constant resources.
        type: FUNC
        next_pass: null
      - name: iree-stream-layout-slices
        description: Lays out packed slices and produces arithmetic required for all
          offsets.
        type: FUNC
        next_pass: null
      - name: iree-stream-fold-uniform-operands
        description: Folds redundant and uniformly constant dispatch operands.
        type: MODULE
        next_pass: null
      - name: iree-stream-fuse-dispatch-bindings
        description: Fuses bindings to the same underlying storage to reduce binding
          count.
        type: MODULE
        next_pass: null
      - name: iree-stream-specialize-dispatches
        description: Specializes executables by inlining/fusing operands based on dispatch
          sites.
        type: MODULE
        next_pass: null
      - name: iree-stream-annotate-dispatch-arguments
        description: Annotates dispatch arguments with potential values derived from
          dispatch sites.
        type: MODULE
        next_pass: null
      - name: iree-stream-annotate-dispatch-assumptions
        description: Adds util.assume.* op to executables from all dispatch sites.
        type: MODULE
        next_pass: null
      - name: iree-stream-pack-dispatch-operands
        description: Packs stream dispatch operands into i32 push constants.
        type: MODULE
        next_pass: null
      - name: iree-stream-annotate-affinities
        description: Annotates affinities on all ops for debugging.
        type: MODULE
        next_pass: null
      - name: iree-stream-dump-statistics
        description: Dumps stream dialect usage information to a file.
        type: MODULE
        next_pass: null
      - name: iree-stream-verify-input
        description: Verifies that input dialects are supported by the streams dialect.
        type: MODULE
        next_pass: null
      - name: iree-stream-verify-affinities
        description: Verifies that all operations have affinities assigned (directly
          or indirectly).
        type: MODULE
        next_pass: null
      - name: iree-stream-verify-lowering-to-tensors
        description: Verifies that input dialects are converted to stream.tensor.* ops.
        type: MODULE
        next_pass: null
      - name: iree-stream-verify-lowering-to-async-resources
        description: Verifies that all stream.tensor.* ops and types are fully lowered
          to stream.async.* resource ops.
        type: MODULE
        next_pass: null
      - name: iree-stream-verify-lowering-to-async
        description: Verifies that all stream.tensor.* ops and types are fully lowered
          to stream.async.* ops and all resources have an assigned lifetime.
        type: MODULE
        next_pass: null
      - name: iree-stream-verify-async-access-ranges
        description: Verifies that stream.async.* access ranges are in bounds where
          possible.
        type: MODULE
        next_pass: null
      - name: iree-stream-verify-lowering-to-cmd
        description: Verifies that all stream.async.* ops and types are fully lowered
          to stream.cmd.* ops.
        type: MODULE
        next_pass: null
  
  util:
    description: util dialect
    passes:
      - name: iree-util-apply-patterns
        description: Applies some risky/IREE-specific canonicalization patterns.
        type: MODULE
        next_pass: null
      - name: iree-util-combine-initializers
        description: Combines global initializers into one.
        type: MODULE
        next_pass: null
      - name: iree-util-drop-compiler-hints
        description: Deletes operations that have no runtime equivalent and are only
          used in the compiler.
        type: MODULE
        next_pass: null
      - name: iree-util-dump-module
        description: Dumps the module IR to the given file path in either textual (.mlir)
          or binary (.mlirbc) format.
        type: MODULE
        next_pass: null
      - name: iree-util-fixed-point-iterator
        description: Iterates a sub-pipeline to a fixed point.
        type: MODULE
        next_pass: null
      - name: iree-util-ipo
        description: Performs basic inter-procedural optimization.
        type: MODULE
        next_pass: null
      - name: iree-util-optimize-int-arithmetic
        description: Optimizes integer arithmetic using a variety of dataflow analysis
          and patterns.
        type: MODULE
        next_pass: null
      - name: iree-util-propagate-subranges
        description: Propagates resource subranges across the program.
        type: MODULE
        next_pass: null
      - name: iree-util-strip-and-splat-constants
        description: Strips constant util.global ops and replaces them with splats.
        type: MODULE
        next_pass: null
      - name: iree-util-strip-debug-ops
        description: Strips debug ops, like assertions.
        type: MODULE
        next_pass: null
      - name: iree-util-fold-globals
        description: Folds duplicate globals and propagates constants.
        type: MODULE
        next_pass: null
      - name: iree-util-fuse-globals
        description: Fuses correlated globals together.
        type: MODULE
        next_pass: null
      - name: iree-util-hoist-into-globals
        description: Greedily hoists eligible constant expressions into globals.
        type: MODULE
        next_pass: null
      - name: iree-util-simplify-global-accesses
        description: Hoists loads and sinks stores to variables to decrease data dependency
          regions.
        type: FUNC
        next_pass: null
      - name: iree-util-import-resources
        description: Imports IR with arbitrary large-data into resources that IREE can
          manage efficiently.
        type: MODULE
        next_pass: null
      - name: iree-util-annotate-op-ordinals
